site_name: CallbackIsolatedExecutor
site_description: >-
  Documentation for callback_isolated_executor — a ROS 2 executor and component
  container that assigns a dedicated OS thread to each callback group, enabling
  per-callback scheduling control (policy, priority, CPU affinity).
site_url: https://autowarefoundation.github.io/callback_isolated_executor_doc
repo_url: https://github.com/autowarefoundation/callback_isolated_executor
repo_name: autowarefoundation/callback_isolated_executor
docs_dir: docs
copyright: Copyright &copy; 2026 The Autoware Foundation

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Integration Guide: integration-guide.md
  - YAML Specification: yaml-specification.md
  - Non-ROS Threads: non-ros-threads.md
  - Tutorial: tutorial.md
  - Comparison with Other Executors: comparison-with-other-executors.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: "#"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
